[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edtech-citation-desk"
version = "0.1.0"
description = "Collect and deduplicate citations while tracking course deadlines."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.40,<2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/citation_desk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

